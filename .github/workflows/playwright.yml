name: Playwright Tests
on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types:
      - completed
  pull_request:
    branches:
      - master

concurrency:
  group: playwright-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    # On a pull request the live site still serves the merged code, so the
    # `E2E:` tests can't reflect the diff — run only the `Local:` ones, which
    # are served from this branch by the webServer. The full suite still runs
    # after each Pages deploy via the workflow_run trigger above.
    - name: Run Playwright tests
      env:
        GREP: ${{ github.event_name == 'pull_request' && 'Local:' || '' }}
      run: npx playwright test ${GREP:+--grep "$GREP"}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-files
        path: |
          playwright-report
          test-results/**
        retention-days: 30
